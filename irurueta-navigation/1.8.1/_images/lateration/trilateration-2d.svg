<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#ffffff"/>

  <!-- Circle A -->
  <circle cx="80" cy="220" r="138.9" fill="none" stroke="#2b6cb0" stroke-width="1.5"/>
  <line x1="80" y1="220" x2="200" y2="150" stroke="#2b6cb0" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="80" cy="220" r="3.5" fill="#2b6cb0"/>
  <text x="60" y="245" fill="#2b6cb0" font-size="13" font-weight="bold">A</text>
  <text x="118" y="192" fill="#2b6cb0" font-size="11">r&#8321;</text>

  <!-- Circle B -->
  <circle cx="320" cy="220" r="138.9" fill="none" stroke="#c05621" stroke-width="1.5"/>
  <line x1="320" y1="220" x2="200" y2="150" stroke="#c05621" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="320" cy="220" r="3.5" fill="#c05621"/>
  <text x="326" y="245" fill="#c05621" font-size="13" font-weight="bold">B</text>
  <text x="248" y="192" fill="#c05621" font-size="11">r&#8322;</text>

  <!-- Circle C -->
  <circle cx="200" cy="60" r="90" fill="none" stroke="#2f855a" stroke-width="1.5"/>
  <line x1="200" y1="60" x2="200" y2="150" stroke="#2f855a" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="200" cy="60" r="3.5" fill="#2f855a"/>
  <text x="207" y="55" fill="#2f855a" font-size="13" font-weight="bold">C</text>
  <text x="206" y="108" fill="#2f855a" font-size="11">r&#8323;</text>

  <!-- Estimated position -->
  <circle cx="200" cy="150" r="5" fill="#1a202c"/>
  <text x="209" y="146" fill="#1a202c" font-size="12" font-weight="bold">P</text>
  <text x="209" y="162" fill="#4a5568" font-size="10.5">estimated position</text>

  <text x="10" y="20" fill="#4a5568" font-size="12">Each circle: known anchor + measured distance to P</text>
